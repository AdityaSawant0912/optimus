name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      # packages/angular's tests resolve @optimus/core and
      # @optimus/node via a webpack alias to their built dist/
      # output (Angular's webpack karma builder doesn't transform raw .ts
      # reached through node_modules) — those two builds must run before
      # test. Not `pnpm build` (root): packages/angular's own build
      # (ng-packagr, for the eventual npm-publish path) currently fails —
      # ng-packagr requires TypeScript >=6.0.0 <6.1.0, a window with no
      # stable release at all (TS went straight from 5.x to 7.0 stable).
      # Workspace-internal consumption never needs angular's own dist —
      # see packages/angular/README.md.
      - run: pnpm --filter @optimus/core --filter @optimus/node build

      - run: pnpm test

      - run: pnpm --filter @optimus/core --filter @optimus/node --filter @optimus/react --filter @optimus/devtools --filter node-ssr-example build

  docs-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/package-lock.json

      - run: npm ci

      - run: npm run build
