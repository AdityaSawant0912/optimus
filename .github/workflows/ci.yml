name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      # packages/angular's tests resolve @useoptimus/core and
      # @useoptimus/node via a webpack alias to their built dist/
      # output (Angular's webpack karma builder doesn't transform raw .ts
      # reached through node_modules) — those two builds must run before
      # test.
      - run: pnpm --filter @useoptimus/core --filter @useoptimus/node build

      - run: pnpm test

      - run: pnpm build

  docs-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/package-lock.json

      - run: npm ci

      - run: npm run build
